name: Publish Docker images

# Builds and pushes prebuilt images to GitHub Container Registry on every
# version tag (and on demand), so self-hosters can `docker compose up` without
# cloning or building:
#   ghcr.io/tsrcharan/veekshana-server:<version>, :latest
#   ghcr.io/tsrcharan/veekshana-web:<version>, :latest
#
# Note: the web image bakes NEXT_PUBLIC_* at build time, so the prebuilt web
# image is wired for the localhost quickstart (host http://localhost:8787,
# key dev-key). Custom keys/hosts need a local build of the web image only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the images with (e.g. 0.2.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: |
            ghcr.io/tsrcharan/veekshana-server:${{ steps.v.outputs.version }}
            ghcr.io/tsrcharan/veekshana-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/TSRCHARAN/veekshana
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/tsrcharan/veekshana-web:${{ steps.v.outputs.version }}
            ghcr.io/tsrcharan/veekshana-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/TSRCHARAN/veekshana
            org.opencontainers.image.licenses=Apache-2.0
